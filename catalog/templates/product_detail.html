{% extends 'base.html' %}

{% block title %}Skystore - {{ product.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                {% if product.image %}
                    <div class="text-center p-4 bg-light">
                        <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}" style="max-height: 400px; object-fit: contain;">
                    </div>
                {% endif %}
                <div class="card-body">
                    <h2 class="card-title mb-3">{{ product.name }}</h2>
                    <p class="card-text text-muted">{{ product.description }}</p>
                    <h3 class="text-primary mb-4">Цена: {{ product.purchase_price }} ₽</h3>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Назад к каталогу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
