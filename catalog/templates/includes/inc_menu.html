<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:list' %}">Блог</a>

        {% if user.is_authenticated %}
            <!-- Персональное приветствие и кнопка выхода -->
            <span class="navbar-text me-3">Привет, {{ user.email }}!</span>
            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
        {% else %}
            <!-- Если пользователь гость -->
            <a class="btn btn-outline-primary me-2" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}



    </nav>
</div>
