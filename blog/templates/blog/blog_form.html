{% extends 'base.html' %}

{% block title %}Skystore - Управление статьей{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Редактирование статьи</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100 mt-3">Сохранить</button>
                    </form>
                    <a href="{% url 'blog:list' %}" class="btn btn-secondary w-100 mt-2">Отмена</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
